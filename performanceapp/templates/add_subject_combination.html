{% extends 'admin_base.html' %}
{% load static %}
{% block content %}
<div class="container">
    <h2 class="mb-4"><i class="fas fa-plus"></i>Add Subject Combination</h2>

    {% if messages %}
        {% for m in messages %}
        <div class="alert alert-{% if m.tags == 'error' %}danger{% else%}{{m.tags}}{% endif %} alert-dismissible fade show" role="alert">
                {{m}}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="department" class="form-lebel">Select Department</label>
            <select class="form-select" id="department" name="department" required >
                <option value="">-- Select Department --</option>
                {% for i in departments %}
                <option value="{{i.id}}">{{i.department_name}} - Section {{i.section}}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="subject" class="form-lebel">Select Subject</label>
            <select class="form-select" id="subject" name="subject" required >
                <option value="">-- Select Subject --</option>
                {% for i in subjects %}
                <option value="{{i.id}}">{{i.subject_name}} - {{i.subject_code}}</option>
                {% endfor %}
            </select>
        </div>

        
        <button type="submit" class="btn btn-success">
            <i class="fas fa-check-circle me-1"></i>Submit
        </button>
    </form>
</div>


{% endblock %}
